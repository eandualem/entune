[project]
name = "entune"
version = "0.2.0"
description = "Dictation with your choice of speech model and a personal dictionary that selects corrections in context."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "httpx2",
  "numpy",
  "pillow",
  "pydantic>=2",
  "pydantic-ai-slim[anthropic,google,groq,mistral,openai]>=2.48",
  "pynput>=1.7,<2 ; sys_platform == 'darwin' or sys_platform == 'win32'",
  "pyobjc-framework-applicationservices>=10 ; sys_platform == 'darwin'",
  "pyobjc-framework-AVFoundation>=10 ; sys_platform == 'darwin'",
  "pyside6>=6.7 ; sys_platform == 'linux'",
  "pystray>=0.19 ; sys_platform == 'darwin' or sys_platform == 'win32'",
  "python-multipart>=0.0.12",
  "pywebview>=5",
  "qtpy>=2 ; sys_platform == 'linux'",
  "pywhispercpp>=1.5",
  "sounddevice>=0.5",
  "starlette>=0.41",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/eandualem/entune"
Documentation = "https://github.com/eandualem/entune#readme"
Issues = "https://github.com/eandualem/entune/issues"

[project.scripts]
entune = "entune.cli:main"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[dependency-groups]
build = ["pyinstaller>=6"]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
  "types-pynput>=1.8.1.20260712",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packaging/Entune.spec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src/entune", "tests"]

[[tool.mypy.overrides]]
module = ["sounddevice", "objc", "Quartz", "ApplicationServices", "AppKit", "AVFoundation", "Foundation", "WebKit", "PyObjCTools", "pystray.*", "webview.*", "qtpy.*", "PIL.*", "parakeet_mlx", "parakeet_mlx.*", "mlx.*", "librosa"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
