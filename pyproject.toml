[project]
name = "dictum"
version = "0.1.0"
description = "Personal dictation workbench: record, transcribe with the speech-to-text model you pick, keep the history, retry with another model, copy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pynput>=1.7 ; sys_platform == 'darwin'",
  "python-multipart>=0.0.12",
  "rumps>=0.4 ; sys_platform == 'darwin'",
  "sounddevice>=0.5 ; sys_platform == 'darwin'",
  "starlette>=0.41",
  "uvicorn>=0.30",
]

[project.scripts]
dictum = "dictum.cli:main"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[dependency-groups]
build = ["pyinstaller>=6"]
dev = [
  "httpx2",
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
  "types-pynput>=1.8.1.20260712",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["packaging/Dictum.spec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src/dictum", "tests"]

[[tool.mypy.overrides]]
module = ["rumps", "sounddevice", "Quartz"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
