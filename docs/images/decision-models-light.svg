<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 462" width="880" height="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Which decision model knows when to fix a misheard word?</title>
<desc id="d">Of 72 dictionary matches that should stay and 47 that should change: Perplexity: 3 wrong swaps, 43 fixes caught; Jev: 1 wrong swaps, 38 fixes caught; OpenAI: 8 wrong swaps, 42 fixes caught; Laya: 8 wrong swaps, 28 fixes caught; Replace every match: 72 wrong swaps, 47 fixes caught.</desc>
