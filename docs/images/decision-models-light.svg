<text x="0" y="34" font-size="24" font-weight="700" fill="#0b0b0b">Which decision model knows when to fix a misheard word?</text>
<text x="0" y="62" font-size="15" fill="#52514e">The dictionary offered another word at 121 places: 47 should change, 72 should stay as spoken.</text>
