<text x="590.2" y="124" font-size="13" text-anchor="end" fill="#c3c2b7">of 72 that should stay</text>
<text x="610.2" y="124" font-size="13" fill="#c3c2b7">of 47 that should change</text>
<text x="0" y="160" font-size="16" font-weight="700" fill="#f0f6fc">Perplexity</text>
<text x="0" y="177" font-size="12.5" fill="#9a998f">pplx-decider, open weights</text>
