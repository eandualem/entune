<text x="0" y="208" font-size="16" font-weight="700" fill="#f0f6fc">Jev</text>
<text x="0" y="225" font-size="12.5" fill="#9a998f">TypeSafe</text>
<rect x="595.2" y="195.0" width="4.0" height="22" rx="3" fill="#d95926"/>
<rect x="601.2" y="195.0" width="188.0" height="22" rx="3" fill="#3987e5"/>
<text x="587.2" y="212.0" font-size="15" font-weight="700" text-anchor="end" fill="#f0f6fc">1</text>
