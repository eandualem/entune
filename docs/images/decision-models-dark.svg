<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 462" width="880" height="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Which decision model knows when to fix a misheard word?</title>
<desc id="d">Of 72 dictionary matches that should stay and 47 that should change: Perplexity: 3 wrong swaps, 43 fixes caught; Jev: 1 wrong swaps, 38 fixes caught; OpenAI: 8 wrong swaps, 42 fixes caught; Laya: 8 wrong swaps, 28 fixes caught; No decision model: 72 wrong swaps, 47 fixes caught.</desc>
<line x1="600.2" x2="600.2" y1="140" y2="386" stroke="#f0f6fc" stroke-width="1.5"/>
<text x="0" y="34" font-size="24" font-weight="700" fill="#f0f6fc">Which decision model knows when to fix a misheard word?</text>
<text x="0" y="62" font-size="15" fill="#c3c2b7">The dictionary offered another word at 121 places: 47 should change, 72 should stay as spoken.</text>
<text x="590.2" y="106" font-size="15" font-weight="700" text-anchor="end" fill="#f0f6fc">Wrong swaps <tspan fill="#d95926">■</tspan></text>
