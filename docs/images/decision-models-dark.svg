<text x="842.0" y="370.0" font-size="15" font-weight="700" fill="#f0f6fc">47</text>
<text x="0" y="420" font-size="13" fill="#c3c2b7">One speaker's dictation, October 2026: the dictionary learned from 7.5 hours and was tested on the</text>
<text x="0" y="439" font-size="13" fill="#c3c2b7">next 2.1 hours (160 recordings). Answers written before any model ran; one reviewer, one run.</text>
