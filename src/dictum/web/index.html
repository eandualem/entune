<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictum</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script>
      // Apply the saved appearance before first paint so the page never flashes.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <main>
      <header>
        <h1><span class="mark"></span>Dictum</h1>
        <details id="settings">
          <summary>Settings</summary>
        </details>
      </header>

      <form id="settings-form" class="card" hidden>
        <div id="keys"></div>
        <label>Default model <select id="default-model"></select></label>
        <fieldset id="shortcut">
          <legend>Dictation shortcuts</legend>
          <label>Hold to talk: one key, record while held, release to stop
            <input id="shortcut-hold" type="text" autocomplete="off" spellcheck="false" placeholder="alt_r" /></label>
          <label>Toggle: a combination, press to start, press again to stop
            <input id="shortcut-toggle" type="text" autocomplete="off" spellcheck="false" placeholder="cmd+shift+space" /></label>
          <small>Both can be set. Key names: alt, alt_r, cmd, ctrl, shift, space, f1…f20, or a single character. Join with +. Leave blank to remove.</small>
        </fieldset>
        <label>Appearance
          <select id="theme">
            <option value="system">Match the system</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <div class="row">
          <button type="submit" class="primary">Save</button>
          <span id="settings-status" class="status"></span>
        </div>
      </form>

      <section id="recorder" class="card row">
        <button id="record" type="button" class="primary">Record</button>
        <label>Model <select id="model"></select></label>
        <span id="status" class="status"></span>
      </section>

      <h2>History</h2>
      <section id="history"></section>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
