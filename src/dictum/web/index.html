<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictum</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Dictum</h1>
        <details id="settings">
          <summary>Settings</summary>
          <form id="settings-form">
            <div id="keys"></div>
            <label>Default model <select id="default-model"></select></label>
            <fieldset id="shortcut">
              <legend>Dictation shortcut (menu-bar app)</legend>
              <label><input type="radio" name="shortcut-mode" value="hold" checked /> Hold one key to talk, release to stop</label>
              <label><input type="radio" name="shortcut-mode" value="toggle" /> Press a key combination to start, press again to stop</label>
              <label>Keys <input id="shortcut-keys" type="text" autocomplete="off" spellcheck="false" placeholder="alt_r  or  cmd+shift+space" /></label>
              <small>Key names: alt, alt_r, cmd, ctrl, shift, space, f1…f20, or a single character. Join with +.</small>
            </fieldset>
            <div class="row">
              <button type="submit">Save</button>
              <span id="settings-status" class="status"></span>
            </div>
          </form>
        </details>
      </header>

      <section id="recorder" class="row">
        <button id="record" type="button">Record</button>
        <label>Model <select id="model"></select></label>
        <span id="status" class="status"></span>
      </section>

      <section id="history"></section>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
