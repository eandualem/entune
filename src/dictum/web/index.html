<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictum</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script>
      // Apply the saved appearance before first paint so the page never flashes.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <main>
      <header>
        <h1><span class="mark"></span>Dictum</h1>
        <details id="settings">
          <summary>Settings</summary>
        </details>
      </header>

      <form id="settings-form" class="card" hidden>
        <div id="keys"></div>
        <label>Default model <select id="default-model"></select></label>
        <fieldset id="shortcut">
          <legend>Dictation shortcuts</legend>
          <label>Hold to talk: one key, record while held, release to stop
            <span class="row shortcut-row">
              <input id="shortcut-hold" type="text" readonly placeholder="not set" />
              <button type="button" class="capture" data-target="shortcut-hold">Record shortcut</button>
              <button type="button" class="clear" data-target="shortcut-hold" title="Remove">Clear</button>
            </span></label>
          <label>Hands-free: a combination to start; press again, or press the hold key, to stop
            <span class="row shortcut-row">
              <input id="shortcut-toggle" type="text" readonly placeholder="not set" />
              <button type="button" class="capture" data-target="shortcut-toggle">Record shortcut</button>
              <button type="button" class="clear" data-target="shortcut-toggle" title="Remove">Clear</button>
            </span></label>
          <small>Click "Record shortcut", then press the key or combination you want; it is saved when you let go. Both can be set, for example hold <b>fn</b> and <b>cmd+fn</b> hands-free.</small>
          <span id="shortcut-status" class="status"></span>
        </fieldset>
        <label>Appearance
          <select id="theme">
            <option value="system">Match the system</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <div class="row">
          <button type="submit" class="primary">Save</button>
          <span id="settings-status" class="status"></span>
        </div>
      </form>

      <section id="recorder" class="card row">
        <button id="record" type="button" class="primary">Record</button>
        <label>Model <select id="model"></select></label>
        <span id="status" class="status"></span>
      </section>

      <h2>History</h2>
      <section id="history"></section>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
